[project]
name = "gen-commit-msg"
version = "0.1.0"
description = "Generate a concise commit message from Git changes with the Generic OpenAI Proxy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1,<1",
]

[project.scripts]
gen-commit-msg = "gen_commit_msg.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"
